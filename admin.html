<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Barbearia do Neguinho</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f3ad16">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js')
          .then(() => console.log("Service Worker Registrado!"))
          .catch(err => console.log("Erro ao registrar SW:", err));
      }
    </script>
    <style>
        .abas { display: flex; gap: 10px; padding: 15px; background: #1a1a1a; }
        .aba { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .aba.ativa { background: #f3ad16; color: #1a1a1a; }
        .aba.inativa { background: #333; color: #fff; }
        .painel { display: none; padding: 15px; }
        .painel.ativo { display: block; }
        .card-agendamento { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 15px; color: #fff; }
        .card-agendamento span { color: #f3ad16; font-weight: bold; }
        .secao-gerenciar { background: #1e1e1e; border: 1px solid #333; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .secao-gerenciar h3 { color: #f3ad16; margin-bottom: 15px; }
        .secao-gerenciar input { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2a2a; border: 2px solid #333; border-radius: 8px; color: #fff; font-size: 1rem; }
        .secao-gerenciar input:focus { outline: none; border-color: #f3ad16; }
        .btn-adicionar { background: #f3ad16; color: #1a1a1a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .item-lista { display: flex; justify-content: space-between; align-items: center; background: #2a2a2a; padding: 10px 15px; border-radius: 8px; margin-top: 8px; color: #fff; }
        .btn-remover { background: #ff4d4d; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>Painel do Barbeiro</h1>
        <nav><ul><li><a href="index.html">Ver Site</a></li></ul></nav>
    </header>

    <div class="abas">
        <button class="aba ativa" onclick="mostrarAba('agenda', event)">📅 Agenda</button>
        <button class="aba inativa" onclick="mostrarAba('gerenciar', event)">⚙️ Gerenciar</button>
    </div>

    <main>
        <!-- ABA AGENDA -->
        <div id="painel-agenda" class="painel ativo">
            <h2 style="text-align: center; color: #fff; background: #333; padding: 10px; border-radius: 8px;">Agenda - Calculando...</h2>
            <div style="text-align: center; margin: 15px 0;">
                <label style="color: #f3ad16; font-weight: bold;">Filtrar por data:</label>
                <input type="date" id="filtro-data" style="padding: 8px; margin-left: 10px; border-radius: 6px; border: 2px solid #f3ad16; background: #2a2a2a; color: #fff; font-size: 1rem;">
                <button id="btn-filtrar" style="margin-left: 10px; padding: 8px 15px; background: #f3ad16; color: #1a1a1a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">FILTRAR</button>
                <button id="btn-todos" style="margin-left: 8px; padding: 8px 15px; background: #555; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">VER TODOS</button>
            </div>
            <div id="lista-agendamentos" style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
                <p style="text-align: center;">Carregando agendamentos...</p>
            </div>
        </div>

        <!-- ABA GERENCIAR -->
        <div id="painel-gerenciar" class="painel">
            <div class="secao-gerenciar">
                <h3>✂️ Serviços</h3>
                <input type="text" id="input-nome-servico" placeholder="Nome do serviço (ex: Corte + Barba)">
                <input type="number" id="input-preco-servico" placeholder="Preço (ex: 45)">
                <button class="btn-adicionar" id="btn-add-servico">+ Adicionar Serviço</button>
                <div id="lista-servicos" style="margin-top: 15px;"></div>
            </div>
            <div class="secao-gerenciar">
                <h3>💈 Barbeiros</h3>
                <input type="text" id="input-nome-barbeiro" placeholder="Nome do barbeiro">
                <input type="tel" id="input-tel-barbeiro" placeholder="WhatsApp com DDD (ex: 11999999999)">
                <button class="btn-adicionar" id="btn-add-barbeiro">+ Adicionar Barbeiro</button>
                <div id="lista-barbeiros" style="margin-top: 15px;"></div>
            </div>
        </div>
    </main>

    <script>
        function mostrarAba(aba, event) {
            document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
            document.querySelectorAll('.aba').forEach(a => { a.classList.remove('ativa'); a.classList.add('inativa'); });
            document.getElementById('painel-' + aba).classList.add('ativo');
            event.target.classList.remove('inativa');
            event.target.classList.add('ativa');
        }
    </script>
    <script type="module" src="admin.js"></script>
</body>
</html>
