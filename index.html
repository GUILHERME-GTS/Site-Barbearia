<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia do Neguinho</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Ativo"));
        }
    </script>
</head>
<body>

    <div id="install-container" style="display: none; background: #f3ad16; padding: 15px; text-align: center; border-bottom: 3px solid #1a1a1a; position: sticky; top: 0; z-index: 1000;">
        <p style="color: #1a1a1a; font-weight: bold; margin-bottom: 10px;">📲 Instale nosso app para agendar mais rápido!</p>
        <button id="btn-install" style="background: #1a1a1a; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer;">INSTALAR</button>
        <button id="btn-close-install" style="background: transparent; border: none; color: #1a1a1a; text-decoration: underline; margin-left: 15px; cursor: pointer;">Depois</button>
    </div>

    <header class="main-header">
        <div class="container">
            <img src="Fotos/logo.png" alt="Logo Barbearia" class="main-logo">
            <h1>Barbearia do Neguinho</h1>
            <p class="welcome-msg">Bem vindo ao nosso sistema de agendamento</p>
            <p style="color: #f3ad16; font-size: 0.85rem; margin-top: 10px; font-weight: bold;">
                📍 Estrada Atílio Squizatto, 4951 - Sala 2, Roseiral, Jarinu - SP
            </p>
            
            <!-- NOVO BOTÃO DE GPS -->
            <a href="https://www.google.com/maps/dir/?api=1&destination=Estrada+Atilio+Squizatto+4951+Jarinu+SP" target="_blank" class="btn-gps">
                🚗 COMO CHEGAR
            </a>

        </div>
    </header>

    <main class="container">
        <section class="booking-card">
            <div class="card">
                <form id="form-agendamento">
                    <div class="input-field">
                        <label>O que vamos fazer?</label>
                        <select id="select-servico" required>
                            <option value="">Carregando serviços...</option>
                        </select>
                    </div>

                    <div class="input-field">
                        <label>Escolha seu Barbeiro:</label>
                        <select id="select-barbeiro" required>
                            <option value="">Carregando barbeiros...</option>
                        </select>
                    </div>

                    <div class="input-field">
                        <label>Data:</label>
                        <input type="date" id="input-data" required>
                    </div>

                    <div class="input-field">
                        <label>Horário Disponível:</label>
                        <select id="select-horario" required>
                            <option value="">Escolha a data primeiro...</option>
                        </select>
                    </div>

                    <hr class="separator">

                    <div class="input-field">
                        <label>Seu Nome:</label>
                        <input type="text" id="input-nome" placeholder="Como podemos te chamar?" required>
                    </div>

                    <div class="input-field">
                        <label>Seu WhatsApp:</label>
                        <input type="tel" id="input-whatsapp" placeholder="11999999999" required>
                    </div>

                    <div class="input-field">
                        <label>Forma de Pagamento:</label>
                        <select id="select-pagamento" required>
                            <option value="presencial">Pagar na barbearia</option>
                            <option value="pix">PIX (Vou enviar comprovante)</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-agendar" class="btn-submit">CONFIRMAR AGENDAMENTO</button>
                </form>

                <div id="comprovante" style="display: none; padding: 20px; text-align: center; background: #222; border: 2px solid #25D366; border-radius: 10px; margin-top: 20px;">
                    <div id="texto-comprovante"></div>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 Barbearia do Neguinho</p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
