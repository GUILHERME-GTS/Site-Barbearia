<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Painel do Barbeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    
    <section style="max-width: 400px; width: 100%; margin: 0;">
        <h2 style="text-align: center;">Painel Administrativo</h2>
        
        <form id="form-login">
            <div class="etapa-formulario">
                <label for="login-email">E-mail de Acesso:</label>
                <input type="email" id="login-email" placeholder="contato@barbearia.com" required>
            </div>

            <div class="etapa-formulario">
                <label for="login-senha">Senha:</label>
                <input type="password" id="login-senha" placeholder="******" required>
            </div>

            <button type="submit" id="btn-entrar">Entrar no Sistema</button>
        </form>
        
        <p id="msg-erro" style="color: #ff4d4d; text-align: center; margin-top: 15px; display: none; font-weight: bold;">
            ⚠️ E-mail ou senha incorretos!
        </p>
    </section>

    <script type="module" src="login.js"></script>
</body>
</html>
